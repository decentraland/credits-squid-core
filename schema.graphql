"""
Represents a credit consumption event on-chain
"""
type CreditConsumption @entity {
  id: ID!
  creditId: String! @index # The ID of the credit consumed
  beneficiary: UserCreditStats! # The user that consumed the credit
  contract: String! @index # The contract that consumed the credit
  amount: BigInt! # Amount of credit consumed
  timestamp: DateTime! # When the credit was consumed
  block: Int! # Block number when consumed
  txHash: String! @index # Transaction hash
  orderHash: String @index # Optional: Squid Router order hash if this consumption was part of a cross-chain order
}

"""
Tracks Squid Router orders that use credits
"""
type SquidRouterOrder @entity {
  id: ID! # orderHash
  orderHash: String! @index # The unique order hash from Spoke
  creditIds: [String!]! # Array of credit IDs used in this order
  totalCreditsUsed: BigInt! # Total credits consumed for this order
  beneficiary: String @index # End-user wallet that consumed the credits (from CreditUsed._sender). Distinct from `fromAddress` (which is the contract that invoked the Spoke, e.g. the Credits Executor).
  fromAddress: String! @index # Sender address on the Spoke call (typically the Credits Executor contract, NOT the end user)
  toAddress: String! @index # Receiver address
  filler: String # Filler address
  fromToken: String # Token being sent
  toToken: String # Token being received
  fromAmount: BigInt # Amount being sent
  fillAmount: BigInt # Amount to fill
  feeRate: BigInt # Fee rate
  fromChain: BigInt # Source chain ID
  toChain: BigInt # Destination chain ID
  txHash: String! @index # Polygon transaction hash (source)
  destinationTxHash: String @index # Ethereum transaction hash (destination) - populated async from Squid API
  squidStatus: String # Status from Squid API (success, ongoing, etc.)
  blockNumber: Int! # Block number
  timestamp: DateTime! # When the order was created
}

"""
Tracks Across (V4) cross-chain deposits that use credits.
Parallel to SquidRouterOrder but for the Across bridge: the source side emits a
FundsDeposited event on the Polygon SpokePool, and the destination fill is resolved
asynchronously via the Across deposit-status API.
"""
type AcrossOrder @entity {
  id: ID! # depositId (stringified uint256)
  depositId: String! @index # Across deposit ID from the FundsDeposited event (uint256)
  creditIds: [String!]! # Array of credit IDs used in this order
  totalCreditsUsed: BigInt! # Total credits consumed for this order
  beneficiary: String @index # End-user wallet that consumed the credits (from CreditUsed._sender)
  depositor: String! @index # Address that made the deposit (the SpokePoolPeriphery / Credits Executor, NOT the end user)
  recipient: String # Destination recipient (e.g. the MulticallHandler on Ethereum)
  inputToken: String # Token deposited on Polygon (normalized to 20-byte address)
  outputToken: String # Token to be delivered on the destination chain
  inputAmount: BigInt # Amount deposited on Polygon (the bridge leg, e.g. USDC)
  inputManaAmount: BigInt # MANA the executor actually spent on the swap = NAME price + bridge/gas overhead (sum of MANA transferred out by the depositor in the source tx)
  outputAmount: BigInt # Amount to be delivered on the destination chain
  destinationChainId: BigInt # Destination chain ID (1 = Ethereum for the NAME-claim flow)
  txHash: String! @index # Polygon transaction hash (source)
  destinationTxHash: String @index # Destination fill tx hash - populated async from the Across API
  acrossStatus: String # Status from the Across API (pending, filled, refunded, expired)
  blockNumber: Int! # Block number
  timestamp: DateTime! # When the deposit was created
}

"""
Tracks MANA transactions correlated with credit usage
"""
type ManaTransaction @entity {
  id: ID! # Transaction hash + event index
  txHash: String! @index # Transaction hash
  fromAddress: String! @index # Sender of MANA
  toAddress: String! @index # Receiver of MANA
  totalManaAmount: BigInt! # Total MANA amount in the transaction
  creditAmount: BigInt # Amount of credits used (if applicable)
  userPaidAmount: BigInt # Amount paid directly by the user
  daoFeeAmount: BigInt # Amount of MANA paid as DAO fee
  relatedConsumptionIds: [String!] # Array of related credit consumption IDs
  timestamp: DateTime! # When the transaction occurred
  block: Int! # Block number
}

"""
Tracks aggregated credit usage per user
"""
type UserCreditStats @entity {
  id: ID! # User address
  address: String! @index # User address
  totalCreditsConsumed: BigInt!
  lastCreditUsage: DateTime
  consumptions: [CreditConsumption!]! @derivedFrom(field: "beneficiary")
}

"""
Tracks hourly credit usage for rate limiting
"""
type HourlyCreditUsage @entity {
  id: ID! # hour timestamp
  totalAmount: BigInt!
  usageCount: Int!
  timestamp: DateTime!
}

"""
Tracks daily credit usage for reporting
"""
type DailyCreditUsage @entity {
  id: ID! # day timestamp
  totalAmount: BigInt!
  uniqueUsers: Int!
  usageCount: Int!
  timestamp: DateTime!
}

"""
Tracks marketplace-specific credit usage
"""
type MarketplaceCreditUsage @entity {
  id: ID!
  creditConsumption: CreditConsumption!
  assetId: String! @index # The ID of the asset purchased
  collectionAddress: String! @index # The collection contract address
  isPrimarySale: Boolean! # Whether this was a primary sale
  price: BigInt! # The price of the asset in MANA
}
